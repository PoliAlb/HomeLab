# Rotazione dei log: evita che i log JSON di Docker riempiano il disco
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
 
oservices:
  # ------------------------------------------- Ingresso: reverse proxy HTTPS
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      - passbolt
      - gitlab
      - nextcloud
      - dns
      - dozzle
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - caddy_data:/data        # contiene la CA interna: va inclusa nei backup
      - caddy_config:/config
    networks:
      default:
        ipv4_address: 172.30.10.10
        aliases:                # i container risolvono i nomi pubblici verso caddy
          - passbolt.${LAB_DOMAIN:-lab.internal}
          - gitlab.${LAB_DOMAIN:-lab.internal}
          - cloud.${LAB_DOMAIN:-lab.internal}
          - pihole.${LAB_DOMAIN:-lab.internal}
          - logs.${LAB_DOMAIN:-lab.internal}
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 443 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging: *default-logging
    deploy:
      resources:
        limits:       { memory: 128m }
        reservations: { memory: 32m }
 
  # ---------------------------------------------------------------- Passbolt
  db-passbolt:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: passbolt
      POSTGRES_PASSWORD: ${PASSBOLT_DB_PASSWORD}
      POSTGRES_DB: passbolt
    volumes:
      - db_passbolt:/var/lib/postgresql/data
    networks: [passbolt_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U passbolt -d passbolt"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *default-logging
    deploy:
      resources:
        limits:       { memory: 512m }
        reservations: { memory: 128m }
 
  passbolt:
    image: passbolt/passbolt:latest-ce
    restart: unless-stopped
    depends_on:
      db-passbolt:
        condition: service_healthy
    environment:
      APP_FULL_BASE_URL: https://passbolt.${LAB_DOMAIN:-lab.internal}
      DATASOURCES_DEFAULT_DRIVER: Cake\Database\Driver\Postgres
      DATASOURCES_DEFAULT_ENCODING: utf8
      DATASOURCES_DEFAULT_HOST: db-passbolt
      DATASOURCES_DEFAULT_PORT: 5432
      DATASOURCES_DEFAULT_USERNAME: passbolt
      DATASOURCES_DEFAULT_PASSWORD: ${PASSBOLT_DB_PASSWORD}
      DATASOURCES_DEFAULT_DATABASE: passbolt
    volumes:
      - gpg_volume:/etc/passbolt/gpg
      - jwt_volume:/etc/passbolt/jwt
    command:
      - /bin/bash
      - -c
      - /usr/bin/wait-for.sh -t 0 db-passbolt:5432 -- /docker-entrypoint.sh
    networks: [passbolt_net, default]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsk -o /dev/null https://localhost/healthcheck/status.json || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging: *default-logging
    deploy:
      resources:
        limits:       { memory: 512m }
        reservations: { memory: 256m }
 
  # ------------------------------------------------------------------ GitLab
  db-gitlab:
    image: postgres:16
    restart: unless-stopped
    command: postgres -c max_locks_per_transaction=512
    environment:
      POSTGRES_USER: gitlab
      POSTGRES_PASSWORD: ${GITLAB_DB_PASSWORD}
      POSTGRES_DB: gitlabhq_production
    volumes:
      - db_gitlab:/var/lib/postgresql/data
    networks: [gitlab_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gitlab -d gitlabhq_production"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *default-logging
    deploy:
      resources:
        limits:       { memory: 1g }
        reservations: { memory: 512m }
 
  gitlab:
    image: gitlab/gitlab-ce:latest
    restart: unless-stopped
    hostname: gitlab.${LAB_DOMAIN:-lab.internal}
    depends_on:
      db-gitlab:
        condition: service_healthy
    environment:
      GITLAB_DB_PASSWORD: ${GITLAB_DB_PASSWORD}
      GITLAB_ROOT_EMAIL: ${GITLAB_ROOT_EMAIL}
      GITLAB_ROOT_PASSWORD: ${GITLAB_ROOT_PASSWORD}
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'https://gitlab.${LAB_DOMAIN:-lab.internal}'
        # HTTPS lo termina Caddy: nginx interno resta in HTTP sulla 80
        letsencrypt['enable'] = false
        nginx['listen_https'] = false
        nginx['listen_port'] = 80
        nginx['proxy_set_headers'] = { "X-Forwarded-Proto" => "https", "X-Forwarded-Ssl" => "on" }
        # SSH: nome dedicato che punta direttamente al container (porta 22)
        gitlab_rails['gitlab_ssh_host'] = 'git-ssh.${LAB_DOMAIN:-lab.internal}'
        postgresql['enable'] = false
        gitlab_rails['db_adapter'] = 'postgresql'
        gitlab_rails['db_encoding'] = 'utf8'
        gitlab_rails['db_host'] = 'db-gitlab'
        gitlab_rails['db_port'] = 5432
        gitlab_rails['db_database'] = 'gitlabhq_production'
        gitlab_rails['db_username'] = 'gitlab'
        gitlab_rails['db_password'] = ENV['GITLAB_DB_PASSWORD']
        puma['worker_processes'] = 0
        sidekiq['concurrency'] = 10
        prometheus_monitoring['enable'] = false
    volumes:
      - gitlab_config:/etc/gitlab
      - gitlab_logs:/var/log/gitlab
      - gitlab_data:/var/opt/gitlab
    shm_size: "256m"
    networks:
      gitlab_net:
      default:
        ipv4_address: 172.30.10.20
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost/-/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s   # GitLab impiega alcuni minuti ad avviarsi
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 5g
          cpus: "3"
        reservations:
          memory: 3g
 
  # --------------------------------------------------------------- Nextcloud
  db-nextcloud:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: ${NEXTCLOUD_DB_PASSWORD}
      POSTGRES_DB: nextcloud
    volumes:
      - db_nextcloud:/var/lib/postgresql/data
    networks: [nextcloud_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextcloud -d nextcloud"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *default-logging
    deploy:
      resources:
        limits:       { memory: 512m }
        reservations: { memory: 128m }
 
  nextcloud:
    image: nextcloud:apache
    restart: unless-stopped
    depends_on:
      db-nextcloud:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db-nextcloud
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: ${NEXTCLOUD_DB_PASSWORD}
      NEXTCLOUD_ADMIN_USER: admin
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
      NEXTCLOUD_TRUSTED_DOMAINS: cloud.${LAB_DOMAIN:-lab.internal}
      # Dietro reverse proxy: link e redirect devono essere https
      OVERWRITEHOST: cloud.${LAB_DOMAIN:-lab.internal}
      OVERWRITEPROTOCOL: https
      OVERWRITECLIURL: https://cloud.${LAB_DOMAIN:-lab.internal}
      TRUSTED_PROXIES: 172.30.10.10
      PHP_MEMORY_LIMIT: 512M
      PHP_UPLOAD_LIMIT: 2G
    volumes:
      - nextcloud_data:/var/www/html
    networks: [nextcloud_net, default]
    healthcheck:
      # status.php è raggiungibile solo se l'host è tra i trusted_domains: localhost resta ammesso dall'installer
      test: ["CMD-SHELL", "curl -fs http://localhost/status.php | grep -q '\"installed\":true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "2"
        reservations:
          memory: 256m
 
  # ---------------------------------------------------------------- Pi-hole
  # Nessuna porta pubblicata: il DNS è raggiungibile solo dalla rete del compose
  # (quindi solo tramite VPN). Il dominio interno è un wildcard verso caddy.
  dns:
    image: pihole/pihole:latest
    restart: unless-stopped
    environment:
      TZ: Europe/Rome
      FTLCONF_webserver_api_password: ${PIHOLE_PASSWORD}
      FTLCONF_dns_listeningMode: all
      FTLCONF_dns_upstreams: "1.1.1.1;9.9.9.9"
      FTLCONF_misc_dnsmasq_lines: "address=/${LAB_DOMAIN:-lab.internal}/172.30.10.10;address=/git-ssh.${LAB_DOMAIN:-lab.internal}/172.30.10.20"
    volumes:
      - pihole_data:/etc/pihole
    networks:
      default:
        ipv4_address: 172.30.10.53
    healthcheck:
      test: ["CMD-SHELL", "dig +short +norecurse +retry=0 @127.0.0.1 pi.hole || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging: *default-logging
    deploy:
      resources:
        limits:       { memory: 256m }
        reservations: { memory: 64m }
 
  # ------------------------------------------------- Monitoraggio (Dozzle)
  dozzle:
    image: amir20/dozzle:v11.3.5     # versione fissata
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      DOZZLE_AUTH_PROVIDER: simple
    volumes:
      - ${DOCKER_SOCK:?definisci DOCKER_SOCK nel .env}:/var/run/docker.sock
    configs:
      - source: dozzle_users
        target: /data/users.yml
    healthcheck:
      test: ["CMD", "/dozzle", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *default-logging
    deploy:
      resources:
        limits:       { memory: 128m }
        reservations: { memory: 32m }
 
  # --------------------------------------- VPN (opzionale): peer NetBird
  # Si avvia solo con:  docker compose --profile vpn up -d
  # Fa da "routing peer": espone 172.30.10.0/24 ai client della VPN.
  netbird:
    image: netbirdio/netbird:latest   # fissa un tag dopo la prima prova
    profiles: [vpn]
    restart: unless-stopped
    cap_add: [NET_ADMIN, SYS_ADMIN, SYS_RESOURCE]
    sysctls:
      net.ipv4.ip_forward: 1
    environment:
      NB_SETUP_KEY: ${NB_SETUP_KEY:-}
      NB_HOSTNAME: homelab-gw
      # NB_MANAGEMENT_URL: https://netbird.tuodominio.tld:443   # solo se self-hosted
    volumes:
      - netbird_data:/etc/netbird
    networks:
      default:
        ipv4_address: 172.30.10.2
    logging: *default-logging
    deploy:
      resources:
        limits: { memory: 128m }
 
# Caddyfile e utenti di Dozzle: creati da Compose (serve Compose >= 2.23.1)
configs:
  caddyfile:
    content: |
      {
      	admin off
      	local_certs      # certificati firmati dalla CA interna di Caddy
      }
 
      passbolt.${LAB_DOMAIN:-lab.internal} {
      	reverse_proxy https://passbolt:443 {
      		transport http {
      			tls_insecure_skip_verify   # certificato self-signed di Passbolt, solo rete interna
      		}
      	}
      }
 
      gitlab.${LAB_DOMAIN:-lab.internal} {
      	request_body {
      		max_size 2GB
      	}
      	reverse_proxy gitlab:80
      }
 
      cloud.${LAB_DOMAIN:-lab.internal} {
      	request_body {
      		max_size 2GB
      	}
      	redir /.well-known/carddav /remote.php/dav 301
      	redir /.well-known/caldav /remote.php/dav 301
      	reverse_proxy nextcloud:80
      }
 
      pihole.${LAB_DOMAIN:-lab.internal} {
      	reverse_proxy dns:80
      }
 
      logs.${LAB_DOMAIN:-lab.internal} {
      	reverse_proxy dozzle:8080
      }
  dozzle_users:
    content: |
      users:
        admin:
          name: Admin
          email: ${DOZZLE_ADMIN_EMAIL}
          password: ${DOZZLE_ADMIN_HASH}
 
volumes:
  caddy_data:
  caddy_config:
  netbird_data:
  db_passbolt:
  db_gitlab:
  db_nextcloud:
  gpg_volume:
  jwt_volume:
  gitlab_config:
  gitlab_logs:
  gitlab_data:
  nextcloud_data:
  pihole_data:
 
networks:
  default:
    ipam:
      config:
        - subnet: 172.30.10.0/24
  passbolt_net:
    internal: true
  gitlab_net:
    internal: true
  nextcloud_net:
    internal: true